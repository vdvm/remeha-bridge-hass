name: Remeha Bridge
version: "0.5.2"
slug: remeha_bridge
description: Shows your Remeha boiler and thermostat in Home Assistant – read-only, via the Remeha Home cloud
url: https://github.com/vdvm/remeha-bridge-hass
arch:
  - aarch64
  - amd64
image: ghcr.io/vdvm/remeha-bridge-app
init: false
startup: services
boot: auto
options:
  email: ""
  password: ""
  poll_interval_s: 60
  timezone: "Europe/Amsterdam"
  model_name: "Tzerra Ace"
  log_level: info
  mqtt:
    host: "core-mosquitto"
    port: 1883
    username: ""
    password: ""
schema:
  email: str?
  password: password?
  poll_interval_s: int(30,3600)?
  timezone: str?
  model_name: str?
  log_level: list(error|warn|info|debug)?
  mqtt:
    host: str?
    port: port?
    username: str?
    password: password?
  api_client_id: str?
  api_subscription_key: str?
